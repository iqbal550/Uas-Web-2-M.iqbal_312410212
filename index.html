<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        
        // Simple app tanpa router dulu
        const app = createApp({
            data() {
                return {
                    message: 'E-Inventory System',
                    loginForm: {
                        username: '',
                        password: ''
                    },
                    isLoggedIn: false
                };
            },
            methods: {
                async login() {
                    try {
                        const response = await axios.post('http://localhost:8080/api/auth/login', {
                            username: this.loginForm.username,
                            password: this.loginForm.password
                        });
                        
                        if (response.data.status) {
                            localStorage.setItem('token', response.data.data.token);
                            localStorage.setItem('user', JSON.stringify(response.data.data.user));
                            localStorage.setItem('isLoggedIn', 'true');
                            this.isLoggedIn = true;
                            alert('Login berhasil!');
                        }
                    } catch (error) {
                        alert('Login gagal: ' + (error.response?.data?.message || error.message));
                    }
                },
                logout() {
                    localStorage.clear();
                    this.isLoggedIn = false;
                }
            },
            mounted() {
                this.isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            },
            template: `
                <div class="min-h-screen bg-gray-50">
                    <nav class="bg-white shadow-lg p-4">
                        <div class="container mx-auto flex justify-between items-center">
                            <div class="flex items-center">
                                <i class="fas fa-boxes text-indigo-600 text-2xl mr-2"></i>
                                <span class="text-xl font-bold text-gray-800">E-Inventory</span>
                            </div>
                            <div v-if="isLoggedIn">
                                <span class="text-gray-600 mr-4">Selamat datang!</span>
                                <button @click="logout" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                                    Logout
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div class="container mx-auto p-8">
                        <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ message }}</h1>
                        
                        <!-- Login Form -->
                        <div v-if="!isLoggedIn" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
                            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>
                            <form @submit.prevent="login" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                    <input v-model="loginForm.username" type="text" required 
                                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input v-model="loginForm.password" type="password" required 
                                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
                                    Login
                                </button>
                            </form>
                            <div class="mt-4 text-center text-sm text-gray-500">
                                <p>Demo: admin / admin123</p>
                            </div>
                        </div>
                        
                        <!-- Dashboard -->
                        <div v-else class="bg-white rounded-xl shadow-lg p-8">
                            <h2 class="text-2xl font-bold text-gray-800 mb-4">Dashboard</h2>
                            <p class="text-gray-600">Anda berhasil login!</p>
                            <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="bg-blue-50 p-4 rounded-lg text-center">
                                    <i class="fas fa-cube text-3xl text-blue-600"></i>
                                    <p class="text-gray-700 mt-2">Products</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-lg text-center">
                                    <i class="fas fa-tags text-3xl text-green-600"></i>
                                    <p class="text-gray-700 mt-2">Categories</p>
                                </div>
                                <div class="bg-purple-50 p-4 rounded-lg text-center">
                                    <i class="fas fa-truck text-3xl text-purple-600"></i>
                                    <p class="text-gray-700 mt-2">Suppliers</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        });

        app.mount('#app');
        console.log('App mounted!');
    </script>
</body>
</html>
